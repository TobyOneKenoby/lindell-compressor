name: Build macOS (SA-670)

on:
  push:
    branches: [sa670-vibealizer]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Configure (universal arm64 + x86_64)
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build VST3 + AU
        run: cmake --build build --config Release --parallel 3 --target SA670_VST3 SA670_AU -- -quiet

      - name: Ad-hoc sign
        run: |
          for P in "build/SA670_artefacts/Release/VST3/SA-670.vst3" "build/SA670_artefacts/Release/AU/SA-670.component"; do
            codesign --force --deep --sign - --timestamp=none "$P"
            codesign --verify --strict --verbose=2 "$P"
          done
          lipo -info "build/SA670_artefacts/Release/VST3/SA-670.vst3/Contents/MacOS/SA-670"

      - name: Package
        run: |
          mkdir -p dist
          cp -R "build/SA670_artefacts/Release/VST3/SA-670.vst3" dist/
          cp -R "build/SA670_artefacts/Release/AU/SA-670.component" dist/
          cat > dist/INSTALL.txt <<'TXT'
          Installera:
            SA-670.vst3      -> ~/Library/Audio/Plug-Ins/VST3/
            SA-670.component -> ~/Library/Audio/Plug-Ins/Components/
          Om macOS blockerar pluginen (nedladdad fil), kör i Terminal:
            xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/SA-670.vst3
            xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/Components/SA-670.component
          TXT

      - uses: actions/upload-artifact@v7
        with:
          name: SA-670-macOS-VST3-AU
          path: dist

      - name: Publish pre-release (permanent download link, no login needed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && ditto -c -k --keepParent SA-670.vst3 ../SA-670-VST3-macOS.zip)
          gh release delete sa670-latest --yes --cleanup-tag || true
          gh release create sa670-latest SA-670-VST3-macOS.zip \
            --target "${{ github.sha }}" --prerelease \
            --title "SA-670 VST3 for macOS" \
            --notes "Universal VST3 (Apple Silicon + Intel), ad-hoc signed. Install to ~/Library/Audio/Plug-Ins/VST3/ and run: xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/SA-670.vst3"
